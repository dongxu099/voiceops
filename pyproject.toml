[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voiceops-desk"
version = "0.1.0"
description = "An inspectable ElevenAgents developer support demo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "typer>=0.15,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "websockets>=14,<16"]

[project.scripts]
voiceops = "voiceops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceops"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge/support-policy.md" = "voiceops/support-policy.md"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
